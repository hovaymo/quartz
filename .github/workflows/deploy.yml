z`n`ame: Deploy Quartz (Hugo)

on:
  push:
    branches:
      - main  # або твоя основна гілка

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v3

      - name: Setup Hugo 🎩
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.147.6'  # Переконайся, що ця версія працює (або можна поновити)

      - name: Build with Hugo 🏗️
        run: hugo --minify

      - name: Deploy to GitHub Pages 🚀
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
